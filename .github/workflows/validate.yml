name: validate
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.3.0, use-dotnet: false }
      - name: Assemble temp project with dependency
        run: |
          mkdir -p _ci/addons/topdown_controller _ci/addons/components_kit
          rsync -a --exclude '.git' --exclude '_ci' ./ _ci/addons/topdown_controller/
          git clone --depth 1 https://github.com/duckenclaw/godot-components-kit _ci/addons/components_kit
          printf '%s\n' 'config_version=5' '' '[application]' 'config/name="ci"' 'config/features=PackedStringArray("4.3", "GL Compatibility")' > _ci/project.godot
          cat > _ci/check.gd <<'GD'
          extends SceneTree
          func _initialize() -> void:
          	var fails := 0
          	for path in ["res://addons/topdown_controller/player/player_3d.tscn", "res://addons/topdown_controller/player/player_sprite.tscn"]:
          		var scene := load(path) as PackedScene
          		var p: Node = scene.instantiate() if scene else null
          		if p == null:
          			fails += 1
          			print("FAIL: " + path)
          			continue
          		root.add_child(p)
          		print("PASS: " + path)
          	print("RESULT: %d failures" % fails)
          	quit(1 if fails > 0 else 0)
          GD
      - run: godot --headless --path _ci --import || true
      - run: godot --headless --path _ci --script check.gd
