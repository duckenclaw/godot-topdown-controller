[plugin]

name="Top-Down Controller"
description="State-machine top-down character controller for 3D worlds: camera-relative movement with walk/run/sprint, dodge roll with i-frames, a melee attack combo with hitbox, and aim to mouse cursor / right stick. Ships a follow camera rig (perspective or orthographic, zoom, 45° rotation) and two looks for the same controller: a 3D model, or a 2D sprite that stands in the 3D world and casts real shadows (2.5D), with directional animations and a sprite-sheet layout helper. Mechanics are modular (config flags + removable state nodes), mirroring the FPS and 2D controllers. Depends on the Components Kit (StateMachine/State/Health)."
author="godot-game-kit"
version="1.0.0"
script="topdown_controller.gd"
